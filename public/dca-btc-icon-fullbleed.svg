<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg" cx="35%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#1c212e"/>
      <stop offset="100%" stop-color="#06070a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F7931A"/>
      <stop offset="100%" stop-color="#FFD27D"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background, no margin -->
  <rect x="0" y="0" width="200" height="200" fill="url(#bg)"/>

  <!-- DCA staircase bars, scaled up to fill the frame -->
  <g>
    <rect x="34" y="122" width="20" height="42" rx="4" fill="url(#gold)" opacity="0.55"/>
    <rect x="66" y="100" width="20" height="64" rx="4" fill="url(#gold)" opacity="0.72"/>
    <rect x="98" y="76"  width="20" height="88" rx="4" fill="url(#gold)" opacity="0.86"/>
    <rect x="130" y="46" width="20" height="118" rx="4" fill="url(#gold)"/>
  </g>

  <!-- trend line -->
  <polyline points="44,116 76,94 108,70 140,38" fill="none" stroke="#FFE3B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

  <!-- coin with B mark -->
  <circle cx="144" cy="32" r="26" fill="url(#gold)"/>
  <path d="M135 18.5 V45.5 M141 18.5 V45.5"
        stroke="#1a1207" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M134 20 H146 C151 20 154 22.6 154 26.4 C154 30.2 151 32.2 146.5 32.2 H134
           M134 32.2 H147 C152.2 32.2 155.2 34.6 155.2 38.4 C155.2 42.3 152.2 45 147 45 H134"
        fill="none" stroke="#1a1207" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M137.5 13.5 V20 M141.5 13.5 V20 M137.5 45 V51.5 M141.5 45 V51.5"
        stroke="#1a1207" stroke-width="2.2" stroke-linecap="round"/>
</svg>
